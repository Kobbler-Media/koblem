name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

# koblibs is consumed as a sibling checkout, not from crates.io or npm:
# Cargo resolves it via path dependencies (`../../koblibs/<crate>`), and
# web/package.json via `"@koblibs/ui": "file:../../koblibs"`. Both need it
# laid out beside this repo, so every job checks out two repositories.
#
# api/ and cli/ are separate Cargo projects; there is no root workspace.
jobs:
  rust:
    name: ${{ matrix.dir }} (rust)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [api, cli]
    steps:
      - uses: actions/checkout@v5
        with:
          path: koblem
      - uses: actions/checkout@v5
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - name: System build deps (ffmpeg headers + libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev \
            libswresample-dev libswscale-dev libchromaprint-dev \
            clang libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: koblem/${{ matrix.dir }}
      - name: fmt
        working-directory: koblem/${{ matrix.dir }}
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: koblem/${{ matrix.dir }}
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: koblem/${{ matrix.dir }}
        run: cargo test

  web:
    name: web (svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: koblem
      - uses: actions/checkout@v5
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: koblem/web
        run: npm install --no-audit --no-fund
      - name: check
        working-directory: koblem/web
        run: npm run check --if-present
      - name: build
        working-directory: koblem/web
        run: npm run build

  docker:
    name: docker build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: koblem
      - uses: actions/checkout@v5
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - name: docker compose build
        working-directory: koblem
        run: docker compose build koblem-api web
