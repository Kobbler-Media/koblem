name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      llama:
        description: Also build koblem-llama (patched llama.cpp, CUDA — slow)
        type: boolean
        default: false

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/kobbler-media
  IMAGES: koblem koblem-web

# Each arch builds natively and pushes :sha-<short>-<arch>; `manifest` joins them
# under :latest and :sha-<short>. A v* tag builds nothing: `release` points the
# version tags at the image main already built for that commit.
jobs:
  images:
    name: build ${{ matrix.arch }}
    if: github.ref_type != 'tag'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free runner disk for the image builds
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/swift
      - uses: actions/checkout@v7
        with:
          path: koblem
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      # `make docker-push-koblem` refreshes the koblibs entries in Cargo.lock first.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build + push :sha-<short>-${{ matrix.arch }}
        working-directory: koblem
        run: make docker-push REGISTRY=$REGISTRY TAG=sha-${GITHUB_SHA::7}-${{ matrix.arch }}

  manifest:
    name: multi-arch :latest
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: join the arch images
        run: |
          sha="sha-${GITHUB_SHA::7}"
          for img in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$img:latest" -t "$REGISTRY/$img:$sha" \
              "$REGISTRY/$img:$sha-amd64" "$REGISTRY/$img:$sha-arm64"
          done

  release:
    name: release ${{ github.ref_name }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: tag the images built from this commit
        run: |
          version="${GITHUB_REF_NAME#v}"
          for img in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$img:$version" -t "$REGISTRY/$img:${version%.*}" \
              "$REGISTRY/$img:sha-${GITHUB_SHA::7}" \
              || { echo "::error::no $img image for ${GITHUB_SHA::7}; tag a commit main has built"; exit 1; }
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  # CUDA, amd64 only. Rarely changes and takes the better part of an hour on a
  # hosted runner, so it only builds on request.
  llama:
    name: koblem-llama
    if: github.event_name == 'workflow_dispatch' && inputs.llama
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for the CUDA build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/swift /usr/local/lib/android
      - uses: actions/checkout@v7
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: make docker-push-llama REGISTRY=$REGISTRY
