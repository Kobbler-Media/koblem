name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      llama:
        description: Also build koblem-llama (patched llama.cpp, CUDA — slow)
        type: boolean
        default: false

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/kobbler-media

jobs:
  images:
    name: build + push to ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for the image builds
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/swift
      - uses: actions/checkout@v7
        with:
          path: koblem
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build + push :latest
        working-directory: koblem
        run: make docker-push REGISTRY=$REGISTRY
      - name: push :sha-<short> and :<tag>
        run: |
          tags="sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF_TYPE" = tag ] && tags="$tags $GITHUB_REF_NAME"
          for img in koblem koblem-web; do
            for t in $tags; do
              docker tag "$REGISTRY/$img:latest" "$REGISTRY/$img:$t"
              docker push "$REGISTRY/$img:$t"
            done
          done

  # Rarely changes and takes the better part of an hour on a hosted runner, so
  # it only builds on request.
  llama:
    name: koblem-llama
    if: github.event_name == 'workflow_dispatch' && inputs.llama
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for the CUDA build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/swift /usr/local/lib/android
      - uses: actions/checkout@v7
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: make docker-push-llama REGISTRY=$REGISTRY
