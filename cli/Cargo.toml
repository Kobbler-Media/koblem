[package]
name = "kob"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "CLI for koblem — call image/rmbg/tts/stt/music/avatar/chat endpoints from scripts"
license = "AGPL-3.0-only"

[[bin]]
name = "kob"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "multipart", "query"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
# `io` only, for ReaderStream — uploads stream off disk instead of being read whole (§9.1).
# Already in the lock as a reqwest dependency, so this pins nothing new.
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
base64 = "0.23.1"
anyhow = "1.0.104"
# `kob queue add` keys an enqueue off its own payload so a re-run of a shell loop
# cannot double-render. Already in the lock via reqwest, so this pins nothing new.
sha2 = "0.11.1"
# `kob queue watch` tails the SSE stream, which is a byte stream of frames.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
koblem-client = { path = "../../koblibs/koblem-client" }
