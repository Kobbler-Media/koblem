services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: koblem
      POSTGRES_PASSWORD: koblem
      POSTGRES_DB: koblem_test
    ports:
      # 5433 is kobbler's test database and 5434 is kobload's. They used to collide,
      # so whichever repo's suite ran second died on "port is already allocated".
      - "5435:5432"
    shm_size: 256mb
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koblem -d koblem_test"]
      interval: 2s
      timeout: 5s
      retries: 5

  nats-test:
    image: nats:2.15.2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      # 4223 is kobbler's test NATS; sccache listens on 4226.
      - "4229:4222"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 5
