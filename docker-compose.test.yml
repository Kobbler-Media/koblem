services:
  postgres-test:
    image: postgres:18.4
    environment:
      POSTGRES_USER: koblem
      POSTGRES_PASSWORD: koblem
      POSTGRES_DB: koblem_test
    ports:
      # 5433 is kobbler's test database and 5434 is kobload's. They used to collide,
      # so whichever repo's suite ran second died on "port is already allocated".
      - "5435:5432"
    shm_size: 256mb
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koblem -d koblem_test"]
      interval: 2s
      timeout: 5s
      retries: 5
