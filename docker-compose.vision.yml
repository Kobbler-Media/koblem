# koblem — vision overlay: zero-shot classification, matting, depth.
#
#   docker compose -f docker-compose.yml -f docker-compose.vision.yml up -d
#
# koblem does NOT run these engines — it calls them. They are separate GPU
# services (EmbeddingGemma-2 embeddings, a vision-server binary for matting and
# depth) that run outside this repository.
# This overlay only wires the URLs; point them wherever your engines actually
# run. If they are in another compose project you will also need koblem on that
# project's network (`docker network connect`, or an `external` network here).
#
# Any URL left empty disables that engine's tab; koblem shows an engine as
# "unreachable" when the URL is set but nothing answers.
#
# Where to get each engine: docs/engines.md.

services:
  koblem-api:
    environment:
      # EmbeddingGemma-2 llama-servers: `embed-vision` (images, GPU-gated) and
      # `embed-text` (always-on text). Unset here = koblem's defaults
      # (http://embed-vision:8080, http://embed-text:8080), which only resolve
      # on a shared docker network — see the file header.
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://embed-vision:8080}
      TEXT_EMBED_SERVICE_URL: ${TEXT_EMBED_SERVICE_URL:-http://embed-text:8080}
      TEXT_EMBED_MAX_TOKENS: ${TEXT_EMBED_MAX_TOKENS:-1024}
      # Background removal. UNGATED — no GpuLock entry; the model is tiny and
      # idle-unloads itself.
      MATTING_SERVICE_URL: ${MATTING_SERVICE_URL:-}
      # Depth-Anything 3 (`POST /depth`) — the SAME vision-server container as
      # matting, reached by its own name so depth can be split onto another
      # card/host later without touching MATTING_SERVICE_URL. It shares
      # matting's gate budget line (one binary, one worker, one VRAM budget).
      DEPTH_SERVICE_URL: ${DEPTH_SERVICE_URL:-}
