server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve upstream hostnames so a koblem-api restart (new container IP)
  # doesn't strand nginx with a stale cached IP. Pair with $upstream variables
  # in proxy_pass below — without the variable, nginx resolves once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Health check endpoint
  location = /health {
    set $api_upstream "koblem-api:8090";
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Proxy API requests to the api container
  location /api/ {
    set $api_upstream "koblem-api:8090";
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Multi-hour timeouts — GPU-gated requests (LLM reviews, queued STT/TTS/
    # Vision behind a TTS preempt) can legitimately block for many minutes.
    # The shared GPU lock is the backpressure mechanism; short network-level
    # timeouts just cause spurious failures on long-running calls.
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_connect_timeout 60s;
    send_timeout 7200s;

    # STT uploads can be long audiobook chunks; vision accepts image batches.
    client_max_body_size 500m;
  }

  # /v1/ proxy mirror — same settings for the OpenAI-compatible open endpoints.
  location /v1/ {
    set $api_upstream "koblem-api:8090";
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_connect_timeout 60s;
    send_timeout 7200s;
    client_max_body_size 500m;
  }

  # 🔴 A cached service worker is a control panel frozen on last week's build. The browser
  # revalidates it on every navigation only if it is allowed to.
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # nginx's bundled mime.types has no .webmanifest entry, and a manifest served as
  # application/octet-stream is a PWA that never offers to install. Scoped to this one file — a
  # server-level `types` block would REPLACE the inherited map and mislabel everything else.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
